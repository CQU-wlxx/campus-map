<!DOCTYPE html>
<html>
<head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>重庆大学实景互动地图</title>
<style>
html,body,#map{width:100%;height:100%;margin:0}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}

/* ===== 顶部工具条：校区切换 + 校园漫游 ===== */
.top-bar{position:absolute;top:14px;left:50%;transform:translateX(-50%);z-index:20;
  display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:center}
.campus-bar{display:flex;gap:6px;padding:5px;border-radius:999px;background:rgba(255,255,255,.94);
  box-shadow:0 6px 20px rgba(0,0,0,.18);backdrop-filter:blur(6px)}
.campus-bar button{border:0;cursor:pointer;padding:9px 16px;border-radius:999px;min-height:40px;
  font-size:14px;font-weight:700;color:#5F5E5A;background:transparent;transition:.2s;white-space:nowrap}
.campus-bar button:hover{background:#F1EFE8}
.campus-bar button.active{background:linear-gradient(135deg,#A01F23,#7D181B);color:#fff;
  box-shadow:0 4px 12px rgba(160,31,35,.35)}
.roam-btn{border:0;cursor:pointer;min-height:44px;padding:10px 18px;border-radius:999px;white-space:nowrap;
  font-size:14px;font-weight:800;color:#fff;background:linear-gradient(135deg,#FF7A45,#E24B4A);
  box-shadow:0 8px 20px rgba(226,75,74,.35);transition:.2s}
.roam-btn:hover{transform:translateY(-2px)}
.roam-btn.active{background:linear-gradient(135deg,#5F5E5A,#2C2C2A)}
.campus-tip{position:absolute;bottom:34px;left:50%;transform:translateX(-50%);z-index:20;
  padding:6px 14px;border-radius:999px;background:rgba(255,255,255,.9);color:#5F5E5A;
  font-size:12px;box-shadow:0 4px 14px rgba(0,0,0,.14);max-width:86vw;text-align:center}

/* ===== 底部隐私声明 ===== */
.privacy{position:absolute;left:0;right:0;bottom:0;z-index:19;padding:5px 12px;text-align:center;
  background:rgba(255,255,255,.88);border-top:1px solid rgba(31,36,48,.08);
  font-size:11px;line-height:1.5;color:#7A838F}
/* 把高德 logo / 版权信息抬到隐私声明上方，避免被遮挡 */
.amap-logo,.amap-copyright{bottom:24px!important}

/* ===== 自定义弹窗卡片 ===== */
.iw-card{position:relative;width:240px;background:#fff;border-radius:16px;overflow:hidden;
  box-shadow:0 12px 32px rgba(31,36,48,.22);font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
.iw-card::after{content:"";position:absolute;left:50%;bottom:-8px;transform:translateX(-50%);
  width:0;height:0;border:8px solid transparent;border-top-color:#fff}
/* 顶部实拍图（占位，替换方式见下方注释） */
.iw-photo{height:120px;background:linear-gradient(135deg,#E9EDF2,#CBD3DC);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:#7A838F}
.iw-photo .ic{font-size:30px}
.iw-photo .tx{font-size:12px;letter-spacing:.5px}
.iw-x{position:absolute;top:8px;right:8px;width:28px;height:28px;border:0;border-radius:50%;
  background:rgba(0,0,0,.35);color:#fff;font-size:15px;line-height:1;cursor:pointer}
.iw-body{padding:10px 12px 12px}
.iw-name{font-size:15px;font-weight:800;color:#1F242C;line-height:1.35}
.iw-meta{margin-top:3px;font-size:12px;color:#7A838F}
.iw-desc{margin-top:6px;font-size:12px;color:#4A5158;line-height:1.55}
.iw-btns{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.iw-btn{flex:1 1 96px;min-height:38px;border-radius:999px;font-size:12px;font-weight:700;text-decoration:none;
  display:flex;align-items:center;justify-content:center;cursor:pointer;border:0;white-space:nowrap;padding:0 6px}

/* ===== 聚合点：低缩放级别下把相邻点位合并成一个 ===================== */
.clu{width:52px;height:52px;border-radius:50%;display:flex;flex-direction:column;
  align-items:center;justify-content:center;background:linear-gradient(135deg,#A01F23,#7D181B);
  color:#fff;border:2px solid #fff;box-shadow:0 6px 16px rgba(160,31,35,.35);cursor:pointer}
.clu b{font-size:15px;font-weight:900;line-height:1}
.clu i{font-size:9px;font-style:normal;opacity:.85;margin-top:1px;letter-spacing:.5px}
.iw-btn.nav{background:linear-gradient(135deg,#A01F23,#7D181B);color:#fff}
.iw-btn.m3d{background:linear-gradient(135deg,#D8A44F,#B8860B);color:#fff}
.iw-btn.walk{background:linear-gradient(135deg,#2B7FF0,#1863CC);color:#fff}

/* ===== 起点标记 + 步行路线结果条 ===== */
.start-pin{width:26px;height:26px;border-radius:50%;background:#2B7FF0;color:#fff;font-size:12px;
  font-weight:800;display:flex;align-items:center;justify-content:center;border:2px solid #fff;
  box-shadow:0 4px 10px rgba(43,127,240,.45)}
.route-bar{position:absolute;left:50%;transform:translateX(-50%);bottom:74px;z-index:22;
  width:min(92vw,430px);background:#fff;border-radius:14px;padding:10px 12px;
  box-shadow:0 10px 28px rgba(31,36,48,.24);display:flex;gap:10px;align-items:center}
.route-bar[hidden]{display:none}
.rb-ic{font-size:22px;flex:none}
.rb-main{flex:1;min-width:0}
.rb-t{font-size:14px;font-weight:800;color:#1F242C;line-height:1.35}
.rb-s{margin-top:2px;font-size:12px;color:#7A838F;line-height:1.4;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rb-acts{flex:none;display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.rb-a{border:0;border-radius:999px;padding:8px 12px;min-height:36px;font-size:12px;font-weight:700;
  cursor:pointer;text-decoration:none;display:flex;align-items:center;background:#F1EFE8;color:#4A5158}
.rb-a.nav{background:linear-gradient(135deg,#A01F23,#7D181B);color:#fff}

@media (max-width:430px){
  .top-bar{top:10px;gap:6px}
  .campus-bar{gap:4px;padding:4px}
  .campus-bar button{padding:9px 12px;font-size:13px;min-height:40px}
  .roam-btn{padding:10px 14px;font-size:13px}
  .iw-card{width:220px}
  .iw-photo{height:110px}
  .route-bar{bottom:66px;padding:9px 10px;gap:8px}
  .rb-t{font-size:13px}
  .rb-a{padding:7px 10px;font-size:11px}
  .privacy{font-size:10px;padding:4px 10px}
}
</style>
<script>window._AMapSecurityConfig={securityJsCode:'251c489f063c19608360f7b90b0a139f'}</script>

<div class="top-bar">
  <div class="campus-bar" id="campusBar">

<script>
/* ===== 初始视角：重庆大学 A 区，zoom 16 ===== */
var INITIAL = {center:[106.468179, 29.565475], zoom:16};
var map = new AMap.Map('map',{
  zoom: INITIAL.zoom,
  center: INITIAL.center,
  viewMode: '3D',
  pitch: 45,
  pitchEnable: true,
  buildingAnimation: true,
  showBuildingBlock: true
});

/* ===== 校区切换 ===== */
var CAMPUSES = {
  ab: {center:[106.464500, 29.566200], zoom:16},
  hx: {center:[106.299500, 29.594500], zoom:16},
  c:  {center:[106.456500, 29.557600], zoom:17}
};
function switchCampus(key){
  var c = CAMPUSES[key];
  if(!c) return;
  stopRoam(false);
  map.setZoomAndCenter(c.zoom, c.center);
  var btns = document.querySelectorAll('#campusBar button');
  for(var i=0;i<btns.length;i++){
    btns[i].classList.toggle('active', btns[i].getAttribute('data-campus') === key);
  }
}
document.querySelectorAll('#campusBar button').forEach(function(b){
  b.addEventListener('click', function(){ switchCampus(b.getAttribute('data-campus')); });
});

/* 新加点位的兜底文案：按业态给一句自然的话，避免「这是某某楼」这种拼接腔 */
function fallbackDesc(name){
  if(/图书馆/.test(name))                return '借阅和自习的场所，考试周通常延长开放。进馆记得带校园卡。';
  if(/食堂|餐厅|美食城/.test(name))       return '校内就餐点，刷校园卡就能吃。饭点人多，错峰去更快。';
  if(/咖啡|茶姬|饮品|奶茶/.test(name))    return '课间买饮品的地方，手机点单更省时间。';
  if(/宿舍|舍|园$/.test(name))            return '学生宿舍片区，一楼有门禁和宿管值班。晚上记得按时回寝。';
  if(/教学楼|大楼|楼$/.test(name))        return '上课的主要教学楼，教室以课表为准。第一次去建议提前十分钟。';
  if(/体育馆|运动场|球场/.test(name))     return '体育课和日常锻炼的运动场地。一般刷卡进场，开放时间看场馆公告。';
  if(/快递|驿站|丰巢|顺丰|韵达/.test(name)) return '快递收发点，凭取件码取件。放学时段排队，建议错峰。';
  if(/校医院/.test(name))                return '看病首诊的地方，大学生医保也在这里登记。带上校园卡和身份证。';
  if(/广场/.test(name))                  return '校园开放空间，活动和集合常用地。约人碰面可以拿它当坐标。';
  if(/湖/.test(name))                    return '校园景观湖，适合散步放松。晚上光线暗，建议结伴走主路。';
  if(/门$/.test(name))                    return '校园出入口，进出刷校园卡或刷脸。晚上关门时间留意安保通知。';
  return '校园里的一个地点，点「🚶 步行去这儿」可以直接带路过去。';
}

function zoneOf(name){
  if(name.indexOf('A区') >= 0) return 'A 区';
  if(name.indexOf('B区') >= 0) return 'B 区';
  if(name.indexOf('C区') >= 0) return 'C 区';
  if(name.indexOf('虎溪') >= 0) return '虎溪校区';
  if(name.indexOf('两江') >= 0) return '两江校区';
  return '重庆大学';
}
function getInfo(name){
  var b = BUILDING_INFO[name] || {};
  return {zone:zoneOf(name), y:b.y || '待补充', d:b.d || fallbackDesc(name)};
}

/* ===== 安全：HTML 转义 =====
   凡是拼进 HTML 字符串（元素内容 或 属性值）的动态文本，一律先过这里。
   地图点位名称现在来自内置常量，但一旦将来换成后台返回 / URL 传入的数据，
   没有这层转义就是标准的 DOM XSS。防御写在使用处，而不是写在使用者的记性里。 */
function esc(s){
  return String(s == null ? '' : s)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

/* ===== 导航：手机优先唤起高德 App，失败降级网页版，全程不覆盖当前页面 ===== */
function isMobileUA(){
  return /Android|iPhone|iPad|iPod|HarmonyOS|Windows Phone|Mobile/i.test(navigator.userAgent || '');
}
/* 高德 URI API 的 App scheme（iOS / Android 各一套），用于直接拉起客户端。
   注意：这里的字段名来自高德公开文档，我在桌面环境无法对真机做实机验证，
   上线前请在 Android 与 iPhone 各点一次确认；即便 scheme 失效，下面也有降级路径，功能不会丢。 */
function appScheme(name, pos){
  var ua  = navigator.userAgent || '';
  var base = /iPhone|iPad|iPod/i.test(ua) ? 'iosamap://' : 'androidamap://';
  return base + 'viewMap?sourceApplication=' + encodeURIComponent('重大校园地图') +
         '&poiname=' + encodeURIComponent(name) +
         '&lat=' + pos[1] + '&lon=' + pos[0] + '&dev=0';
}
/* 用隐藏 iframe 触发唤起：iframe 里的跳转不会动父页面，因此无论如何都不会覆盖当前页面。
   （代价是 iOS 某些版本会拦截 iframe 唤起，这时会走下面的降级分支。） */
function launchAppOrWeb(name, pos){
  var web = navUrl(name, pos);
  if(!isMobileUA()){ window.open(web, '_blank', 'noopener'); return; }
  var app = appScheme(name, pos);
  var launched = false;
  function markLaunched(){ launched = true; }
  document.addEventListener('visibilitychange', markLaunched);
  window.addEventListener('pagehide', markLaunched);

  var ifr = document.createElement('iframe');
  ifr.style.display = 'none';
  ifr.setAttribute('src', app);
  document.body.appendChild(ifr);

  setTimeout(function(){
    document.removeEventListener('visibilitychange', markLaunched);
    window.removeEventListener('pagehide', markLaunched);
    if(ifr.parentNode) ifr.parentNode.removeChild(ifr);
    if(!launched){                                   // 页面还在前台 = 没唤起成功
      window.open(web, '_blank', 'noopener');        // 降级：新窗口打开网页版，当前页不受影响
    }
  }, 1500);
}
function cardHtml(name, pos){

     ① 名称 / 简介等全部走 esc() 转义后再拼串；
     ② 按钮不再把名称拼进 onclick 的 JS 字符串（那样既要操心引号又要操心转义），
        改为写进 data-name 属性（同样转义），点击时由 DOM 读回。

     <img src="photos/建筑名.jpg" style="width:100%;height:120px;object-fit:cover;display:block"> 即可 */
  return '<div class="iw-card" onclick="event.stopPropagation()" onmousedown="event.stopPropagation()">' +
    '<div class="iw-photo"><div class="ic">🏛️</div><div class="tx">实拍图占位 · 待替换</div></div>' +

      '<div class="iw-meta">📍 ' + esc(it.zone) + ' · 建成 ' + esc(it.y) + '</div>' +
      '<div class="iw-desc">' + esc(it.d) + '</div>' +
      '<div class="iw-btns">' +
        '<button class="iw-btn nav" data-name="' + esc(name) + '" data-lng="' + esc(pos[0]) + '" data-lat="' + esc(pos[1]) + '" ' +
          'onclick="event.stopPropagation();navFrom(this)">📍 导航到此</button>' +
        '<button class="iw-btn walk" data-name="' + esc(name) + '" data-lng="' + esc(pos[0]) + '" data-lat="' + esc(pos[1]) + '" ' +
          'onclick="event.stopPropagation();planWalkFrom(this)">🚶 步行去这儿</button>' +
      '</div>' +
      (hasModel(name)

          'onclick="event.stopPropagation();open3dFrom(this)">🏛️ 查看3D模型</button></div>'
        : '') +
    '</div>' +
  '</div>';
}

/* ===== 🚶 步行路径规划（AMap.Walking）=====
   起点：默认取地图中心；在地图上「右键 / 长按」可自定义起点（蓝色「起」标记）
   终点：卡片里的建筑点位；结果条显示距离与预计时间，并可跳转高德 App 导航 */
var walking = null, startPoint = null, startMarker = null;
var routeBar = document.getElementById('routeBar');
var routeTarget = null;                 // 当前规划路线的终点，供「高德导航」按钮使用

function rbEl(id){ return document.getElementById(id); }
function navRouteFromBar(){
  if(routeTarget) launchAppOrWeb(routeTarget.name, routeTarget.pos);
}
function mapCenter(){
  var c = map.getCenter();
  return [c.getLng(), c.getLat()];
}
function ensureWalking(cb){
  if(walking){ cb(); return; }
  try{
    AMap.plugin(['AMap.Walking'], function(){
      try{
        walking = new AMap.Walking({map: map, panel: null, autoFitView: false, hideMarkers: true});
      }catch(e){
        try{ walking = new AMap.Walking({map: map, panel: null, autoFitView: false}); }catch(e2){}
      }
      cb();
    });
  }catch(e){ cb(); }
}
function setStart(pos, label){
  startPoint = pos;
  if(startMarker){ map.remove(startMarker); startMarker = null; }
  startMarker = new AMap.Marker({
    position: pos,
    content: '<div class="start-pin">起</div>',
    offset: new AMap.Pixel(-13, -13),
    zIndex: 300
  });
  map.add(startMarker);
  setTip('📍 起点已设为「' + label + '」，点卡片里的「🚶 步行去这儿」看路线');
}
function clearStart(){
  startPoint = null;
  if(startMarker){ map.remove(startMarker); startMarker = null; }
  setTip();
}
function clearRoute(){
  try{ if(walking) walking.clear(); }catch(e){}
  if(routeBar) routeBar.hidden = true;
  setTip();
}
function planWalk(name, lng, lat){
  var end = [lng, lat];
  var from = startPoint || mapCenter();
  ensureWalking(function(){
    try{ if(walking) walking.clear(); }catch(e){}
    setTip('🚶 正在规划到「' + name + '」的步行路线…');
    try{
      walking.search(from, end, function(status, result){
        if(status !== 'complete' || !result || !result.routes || !result.routes.length){
          setTip('⚠️ 这段路步行规划不出来（可能跨校区太远），先切到目标所在的校区再试');
          return;
        }
        var r = result.routes[0];
        var dist = r.distance || 0;
        var mins = Math.max(1, Math.round((r.time || 0) / 60));
        var dTxt = dist >= 1000 ? (dist / 1000).toFixed(1) + ' 公里' : dist + ' 米';
        rbEl('rbDist').textContent = dTxt;
        rbEl('rbTime').textContent = mins + ' 分钟';
        rbEl('rbSub').textContent = (startPoint ? '自定义起点' : '地图中心') + ' → ' + name;

/* ===== 分级渲染：低级别聚合、高级别才显示文字标签 =====
   90 个点位全画标签会糊成一片，所以：
   · zoom < LABEL_ZOOM  → 只画普通图钉（无文字），并且把相邻点按网格合并成一个聚合点
   · zoom >= LABEL_ZOOM → 每个点独立显示，并带上文字标签
   如果 A 区在 16 级下仍觉得密，把 LABEL_ZOOM 调成 17 即可，只改这一个常量。 */
var LABEL_ZOOM = 16;
/* 各缩放级别下的网格边长（单位：度）。级别越低格子越大，合并得越狠 */
var ZOOM_CELL = {10:0.10, 11:0.06, 12:0.035, 13:0.018, 14:0.009, 15:0.0045};
function cellFor(zoom){
  if(ZOOM_CELL[zoom] !== undefined) return ZOOM_CELL[zoom];
  return zoom < 10 ? 0.10 : 0;          // >= LABEL_ZOOM 返回 0，表示不聚合
}
var layerMarkers = [];                  // 当前画在图上的标记（原始点 或 聚合点）
function clearLayer(){
  layerMarkers.forEach(function(m){ try{ map.remove(m); }catch(e){} });
  layerMarkers = [];
}
function addPointMarker(p, withLabel){
  var opt = {position: p.pos, title: p.name};
  /* 高德 Marker 的 label.content 是按 HTML 渲染的，等同于一次 innerHTML —— 必须转义 */
  if(withLabel) opt.label = {content: esc(p.name), direction: 'top'};
  var m = new AMap.Marker(opt);
  m.on('click', function(){ openInfo(p.name, p.pos); });
  layerMarkers.push(m);
  map.add(m);
}
function renderLayer(){
  clearLayer();
  var z = Math.round(map.getZoom());
  var cell = cellFor(z);
  if(cell > 0){
    /* ---- 聚合模式：按网格分桶 ---- */
    var clusters = {}, keys = [];
    POINTS.forEach(function(p){
      var k = Math.floor(p.pos[0] / cell) + '|' + Math.floor(p.pos[1] / cell);
      if(!clusters[k]){ clusters[k] = {n:0, lng:0, lat:0, items:[]}; keys.push(k); }
      var c = clusters[k];
      c.n++; c.lng += p.pos[0]; c.lat += p.pos[1]; c.items.push(p);
    });
    keys.forEach(function(k){
      var c = clusters[k];
      var center = [c.lng / c.n, c.lat / c.n];
      if(c.n === 1){ addPointMarker(c.items[0], false); return; }   // 单点的桶直接画普通图钉
      var m = new AMap.Marker({
        position: center,
        content: '<div class="clu"><b>' + c.n + '</b><i>个地点</i></div>',
        offset: new AMap.Pixel(-26, -26),
        zIndex: 150
      });
      m.on('click', function(){
        setTip('🔍 这一带有 ' + c.n + ' 个地点，正在放大展开');
        map.setZoomAndCenter(Math.min(18, z + 2), center);
      });
      layerMarkers.push(m);
      map.add(m);
    });
    setTip('🔍 已按区域合并成 ' + keys.length + ' 个聚合点，放大到第 ' + LABEL_ZOOM + ' 级看具体名称');
  }else{
    /* ---- 展开模式：每个点独立 + 文字标签 ---- */
    POINTS.forEach(function(p){ addPointMarker(p, true); });
    setTip();
  }
}
map.on('zoomend', function(){
  /* 轻微防抖，避免连续缩放时反复重绘 */
  if(window.__renderTimer) clearTimeout(window.__renderTimer);
  window.__renderTimer = setTimeout(renderLayer, 80);
});
