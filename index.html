<style>
html,body,#map{width:100%;height:100%;margin:0}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}

/* ===== 顶部工具条：校区切换 + 校园漫游 ===== */
.top-bar{position:absolute;top:14px;left:50%;transform:translateX(-50%);z-index:20;
  display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:center}
.campus-bar{display:flex;gap:6px;padding:5px;border-radius:999px;background:rgba(255,255,255,.94);
  box-shadow:0 6px 20px rgba(0,0,0,.18);backdrop-filter:blur(6px)}
.campus-bar button{border:0;cursor:pointer;padding:9px 16px;border-radius:999px;min-height:40px;
  font-size:14px;font-weight:700;color:#5F5E5A;background:transparent;transition:.2s;white-space:nowrap}
.campus-bar button:hover{background:#F1EFE8}
.campus-bar button.active{background:linear-gradient(135deg,#A01F23,#7D181B);color:#fff;
  box-shadow:0 4px 12px rgba(160,31,35,.35)}
.roam-btn{border:0;cursor:pointer;min-height:44px;padding:10px 18px;border-radius:999px;white-space:nowrap;
  font-size:14px;font-weight:800;color:#fff;background:linear-gradient(135deg,#FF7A45,#E24B4A);
  box-shadow:0 8px 20px rgba(226,75,74,.35);transition:.2s}
.roam-btn:hover{transform:translateY(-2px)}
.roam-btn.active{background:linear-gradient(135deg,#5F5E5A,#2C2C2A)}
.campus-tip{position:absolute;bottom:18px;left:50%;transform:translateX(-50%);z-index:20;
  padding:6px 14px;border-radius:999px;background:rgba(255,255,255,.9);color:#5F5E5A;
  font-size:12px;box-shadow:0 4px 14px rgba(0,0,0,.14);max-width:86vw;text-align:center}

/* ===== 自定义弹窗卡片 ===== */
.iw-card{position:relative;width:240px;background:#fff;border-radius:16px;overflow:hidden;
  box-shadow:0 12px 32px rgba(31,36,48,.22);font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
.iw-card::after{content:"";position:absolute;left:50%;bottom:-8px;transform:translateX(-50%);
  width:0;height:0;border:8px solid transparent;border-top-color:#fff}
/* 顶部实拍图（占位，替换方式见下方注释） */
.iw-photo{height:120px;background:linear-gradient(135deg,#E9EDF2,#CBD3DC);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:#7A838F}
.iw-photo .ic{font-size:30px}
.iw-photo .tx{font-size:12px;letter-spacing:.5px}
.iw-x{position:absolute;top:8px;right:8px;width:28px;height:28px;border:0;border-radius:50%;
  background:rgba(0,0,0,.35);color:#fff;font-size:15px;line-height:1;cursor:pointer}
.iw-body{padding:10px 12px 12px}
.iw-name{font-size:15px;font-weight:800;color:#1F242C;line-height:1.35}
.iw-meta{margin-top:3px;font-size:12px;color:#7A838F}
.iw-desc{margin-top:6px;font-size:12px;color:#4A5158;line-height:1.55}
.iw-btns{display:flex;gap:8px;margin-top:10px}
.iw-btn{flex:1;min-height:38px;border-radius:999px;font-size:12px;font-weight:700;text-decoration:none;
  display:flex;align-items:center;justify-content:center;cursor:pointer;border:0}
.iw-btn.nav{background:linear-gradient(135deg,#A01F23,#7D181B);color:#fff}
.iw-btn.m3d{background:linear-gradient(135deg,#D8A44F,#B8860B);color:#fff}

@media (max-width:430px){
  .top-bar{top:10px;gap:6px}
  .campus-bar{gap:4px;padding:4px}
  .campus-bar button{padding:9px 12px;font-size:13px;min-height:40px}
  .roam-btn{padding:10px 14px;font-size:13px}
  .iw-card{width:220px}
  .iw-photo{height:110px}
}
</style>

<script>
/* ===== 初始视角：重庆大学 A 区，zoom 16 ===== */
var INITIAL = {center:[106.468179, 29.565475], zoom:16};
var map = new AMap.Map('map',{
  zoom: INITIAL.zoom,
  center: INITIAL.center,
  viewMode: '3D',
  pitch: 45,
  pitchEnable: true,
  buildingAnimation: true,
  showBuildingBlock: true
});

/* ===== 校区切换 ===== */
var CAMPUSES = {
  ab: {center:[106.464500, 29.566200], zoom:16},
  hx: {center:[106.299500, 29.594500], zoom:16},
  c:  {center:[106.456500, 29.557600], zoom:17}
};
function switchCampus(key){
  var c = CAMPUSES[key];
  if(!c) return;
  stopRoam(false);
  map.setZoomAndCenter(c.zoom, c.center);
  var btns = document.querySelectorAll('#campusBar button');
  for(var i=0;i<btns.length;i++){
    btns[i].classList.toggle('active', btns[i].getAttribute('data-campus') === key);
  }
}
document.querySelectorAll('#campusBar button').forEach(function(b){
  b.addEventListener('click', function(){ switchCampus(b.getAttribute('data-campus')); });
});

/* ===== 建筑信息：y = 建成年份（请替换为真实年份），d = 一句话简介 ===== */
var BUILDING_INFO = {
  '重庆大学A区图书馆':   {y:'待补充', d:'自习与借阅的主战场，期末复习一座难求'},

  '重庆大学虎溪校区体育中心体育馆':{y:'待补充', d:'虎溪大型体育赛事与体测场地'},
  '重庆大学虎溪校区北门': {y:'待补充', d:'虎溪主校门，校车与小绿都在这里发车'}
};
/* 按类型兜底生成简介，避免留白 */
function fallbackDesc(name){
  if(/食堂|餐厅|美食城|咖啡/.test(name)) return '校内就餐点，校园卡直接刷卡';
  if(/宿舍|舍/.test(name))   return '学生宿舍楼，一楼有门禁与宿管值班';
  if(/教学楼|大楼|楼$/.test(name)) return '教学与自习楼栋，课表上的教室大多在这';
  if(/图书馆/.test(name))    return '借阅与自习场所，考试周延长开放';
  if(/体育馆|运动场|球场/.test(name)) return '运动场地，体育课与体测在这里';
  if(/门/.test(name))        return '校园出入口，校外交通接驳点';
  if(/快递|驿站|丰巢|顺丰|韵达/.test(name)) return '快递收发点，取件记得带取件码';
  if(/校医院/.test(name))    return '校内医疗点，首诊与医保登记都在这';
  if(/广场/.test(name))      return '校园开放空间，活动与集合常用地';
  if(/湖/.test(name))        return '校园景观湖，休闲散步的好去处';
  return '校园地点，点「导航到此」可直接带路';
}
function zoneOf(name){
  if(name.indexOf('A区') >= 0) return 'A 区';
  if(name.indexOf('B区') >= 0) return 'B 区';
  if(name.indexOf('C区') >= 0) return 'C 区';
  if(name.indexOf('虎溪') >= 0) return '虎溪校区';
  if(name.indexOf('两江') >= 0) return '两江校区';
  return '重庆大学';
}
function getInfo(name){
  var b = BUILDING_INFO[name] || {};
  return {zone:zoneOf(name), y:b.y || '待补充', d:b.d || fallbackDesc(name)};
}

var infoWindow = new AMap.InfoWindow({
  isCustom: true,
  autoMove: true,
  offset: new AMap.Pixel(0, -46)
});
function closeInfo(){ infoWindow.close(); }
function navUrl(name, pos){
  return 'https://uri.amap.com/marker?position=' + pos[0] + ',' + pos[1] +
         '&name=' + encodeURIComponent(name) + '&src=cqu&coordinate=gaode&callnative=1';
}
function open3d(name){ window.open('3d.html?b=' + encodeURIComponent(name), '_blank'); }
function cardHtml(name, pos){
  var it = getInfo(name);
  /* 照片位：把下面这个 div.iw-photo 整块换成
     <img src="photos/建筑名.jpg" style="width:100%;height:120px;object-fit:cover;display:block"> 即可 */
  return '<div class="iw-card" onclick="event.stopPropagation()" onmousedown="event.stopPropagation()">' +
    '<div class="iw-photo"><div class="ic">🏛️</div><div class="tx">实拍图占位 · 待替换</div></div>' +
    '<button class="iw-x" onclick="event.stopPropagation();closeInfo()">✕</button>' +
    '<div class="iw-body">' +
      '<div class="iw-name">' + name + '</div>' +
      '<div class="iw-meta">📍 ' + it.zone + ' · 建成 ' + it.y + '</div>' +
      '<div class="iw-desc">' + it.d + '</div>' +
      '<div class="iw-btns">' +
        '<a class="iw-btn nav" target="_blank" rel="noopener noreferrer" href="' + navUrl(name, pos) + '">📍 导航到此</a>' +
        '<button class="iw-btn m3d" onclick="event.stopPropagation();open3d(\'' + name.replace(/'/g, '') + '\')">🏛️ 查看3D模型</button>' +
      '</div>' +
    '</div>' +
  '</div>';
}
function openInfo(name, position){
  infoWindow.setContent(cardHtml(name, position));
  infoWindow.open(map, position);
}
/* 点地图空白处关闭弹窗 */
map.on('click', function(){ infoWindow.close(); });

var roaming = false, roamTimer = null, roamIdx = 0;
var roamBtn = document.getElementById('roamBtn');
var tipEl  = document.getElementById('campusTip');

function setTip(text){ if(tipEl) tipEl.textContent = text || ('共 ' + pointCount + ' 个标注点 · 点图钉看名称'); }
function flyTo(pos, zoom){
  try{
    if(typeof map.flyTo === 'function'){ map.flyTo({center:pos, zoom:zoom, pitch:60}); return; }
  }catch(e){}
  map.setZoomAndCenter(zoom, pos);
}
function roamStep(){
  if(!roaming) return;
  if(roamIdx >= ROAM.length){ stopRoam(true); return; }
  var s = ROAM[roamIdx];
  flyTo(s.p, 17);
  setTip('🎬 正在漫游：' + s.n + '（' + (roamIdx + 1) + '/' + ROAM.length + '）');
  roamIdx++;
  roamTimer = setTimeout(roamStep, 2000);
}
function startRoam(){
  infoWindow.close();
  roaming = true; roamIdx = 0;
  roamBtn.classList.add('active');
  roamBtn.textContent = '⏹ 停止漫游';
  roamStep();
}
function stopRoam(finished){
  if(!roaming && !finished) return;
  roaming = false;
  if(roamTimer){ clearTimeout(roamTimer); roamTimer = null; }
  roamBtn.classList.remove('active');
  roamBtn.textContent = '🎬 校园漫游';
  if(finished){
    try{ map.setPitch(45); }catch(e){}
    flyTo(INITIAL.center, INITIAL.zoom);
    setTip('✅ 漫游结束，已回到 A 区初始视角');
  }else{
    setTip();
  }
}
